<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Manager Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="dashboard-container">
        <!-- Control Panel by left -->
        <div class="control-panel">
            <h2>Control Panel</h2>
            <form>
                <h3>Add new Task</h3>
                <label for="task-title-input">Task Title</label>
                <input type="text" id="task-title-input" placeholder="e.g Finalize project roadmap" required>

                <select id="task-priority-select">
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>

                <button type="submit">+ Add Task</button>
            </form>
        </div>

        <!-- The feed by right-->
        <div class="task-board">

            <section class="board-column">

                <div class="column-header">
                    <h2>Pending Tasks</h2>
                    <span class="plus-icon">+</span>
                </div>
                <div id="pending-tasks-container"></div>

            </section>

            <section class="board-column">
                <div class="column-header">
                    <h2>Completed Tasks</h2>
                    <span class="plus-icon">+</span>
                </div>
                <div id="completed-tasks-container"></div>

            </section>

        </div>
        
    </main>

    <script src="script.js"></script>
</body>
</html>
